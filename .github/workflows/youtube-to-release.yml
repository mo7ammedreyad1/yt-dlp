name: تحميل فيديو ورفعه كـ Release (Cobalt API)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'رابط الفيديو (YouTube, TikTok, Instagram, Twitter... الخ)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  download-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: إعداد Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: تثبيت مكتبات Node
        run: npm install

      - name: تحميل الفيديو ورفعه كـ Release
        env:
          VIDEO_URL: ${{ inputs.video_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node download-and-release.js
