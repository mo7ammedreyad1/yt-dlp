name: تحميل فيديو يوتيوب (متصفح حقيقي - Playwright) ورفعه كـ Release

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'رابط فيديو اليوتيوب'
        required: true
        type: string

permissions:
  contents: write

jobs:
  download-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: إعداد Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: تثبيت ffmpeg (للدمج لو الستريمات جت منفصلة)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: تثبيت مكتبات Node
        run: npm install

      - name: تثبيت متصفح Chromium الخاص بـ Playwright
        run: npx playwright install --with-deps chromium

      - name: تحميل الفيديو عن طريق متصفح حقيقي ورفعه كـ Release
        env:
          VIDEO_URL: ${{ inputs.video_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node download-and-release.js
